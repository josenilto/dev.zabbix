## Overrides for production. Mission-critical posture: HA everywhere, longer retention,
## internal DB disabled in favor of a managed/external database, all alert receivers on.
global:
  environment: prd
  podSecurityStandard: restricted

zabbix:
  server:
    replicaCount: 3
    haCluster: true
    podAntiAffinity: hard
    topologySpreadConstraints: true
    resources:
      requests: { cpu: 1, memory: 2Gi }
      limits: { cpu: 4, memory: 8Gi }
  frontend:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
  proxy:
    ha:
      enabled: true
      replicaCount: 3
    persistence:
      size: 100Gi
    buffering:
      offlineBuffer: 2160          # 90 days store-and-forward for prolonged outages

database:
  internal:
    mysql:
      enabled: false               # production uses external managed DB (see values-<cloud>.yaml)
  external:
    enabled: true

security:
  podSecurityContext:
    runAsNonRoot: true
  admissionPolicies:
    kyverno:
      enabled: true

networkPolicy:
  defaultDeny: true

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      replicas: 3
      retention: 90d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests: { storage: 500Gi }
  alertmanager:
    alertmanagerSpec:
      replicas: 3

loki:
  deploymentMode: SimpleScalable
  write:
    replicas: 3
  read:
    replicas: 3
  backend:
    replicas: 3

tempo:
  replicas: 3

grafana:
  replicas: 3
  persistence:
    size: 20Gi

alerting:
  receivers:
    slack:
      enabled: true
    msteams:
      enabled: true
    pagerduty:
      enabled: true
    email:
      enabled: true

velero:
  enabled: true
  schedules:
    daily:
      schedule: "0 2 * * *"
      ttl: "2160h"                 # 90 days immutable retention

finops:
  opencost:
    enabled: true

externalSecrets:
  enabled: true
  vault:
    enabled: true
