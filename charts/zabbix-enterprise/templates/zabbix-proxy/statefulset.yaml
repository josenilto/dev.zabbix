{{- if .Values.zabbix.proxy.enabled }}
{{- $root := . }}
{{- $instances := .Values.zabbix.proxy.instances }}
{{- if not $instances }}
{{- $instances = list (dict "name" "default" "mode" .Values.zabbix.proxy.mode) }}
{{- end }}
{{- range $instances }}
{{- $instance := . }}
{{- $instanceName := printf "zabbix-proxy-%s" $instance.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zabbix-enterprise.componentName" (dict "root" $root "component" $instanceName) }}
  namespace: {{ include "zabbix-enterprise.namespace" $root }}
  labels:
    {{- include "zabbix-enterprise.componentLabels" (dict "root" $root "component" $instanceName) | nindent 4 }}
    zabbix-enterprise/proxy-instance: {{ $instance.name }}
spec:
  serviceName: {{ include "zabbix-enterprise.componentName" (dict "root" $root "component" $instanceName) }}
  replicas: {{ if $root.Values.zabbix.proxy.ha.enabled }}{{ $root.Values.zabbix.proxy.ha.replicaCount }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "zabbix-enterprise.selectorLabels" (dict "root" $root "component" $instanceName) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zabbix-enterprise.componentLabels" (dict "root" $root "component" $instanceName) | nindent 8 }}
        zabbix-enterprise/proxy-instance: {{ $instance.name }}
    spec:
      serviceAccountName: {{ include "zabbix-enterprise.serviceAccountName" $root }}
      securityContext:
        {{- include "zabbix-enterprise.podSecurityContext" $root | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "zabbix-enterprise.selectorLabels" (dict "root" $root "component" $instanceName) | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: zabbix-proxy
          image: {{ include "zabbix-enterprise.image" (dict "root" $root "repository" $root.Values.zabbix.proxy.image.repository "tag" $root.Values.zabbix.proxy.image.tag) }}
          imagePullPolicy: {{ $root.Values.zabbix.proxy.image.pullPolicy }}
          securityContext:
            {{- include "zabbix-enterprise.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: trapper
              containerPort: 10051
              protocol: TCP
          env:
            - name: ZBX_HOSTNAME
              value: {{ $instance.name }}
            - name: ZBX_SERVER_HOST
              value: {{ include "zabbix-enterprise.componentName" (dict "root" $root "component" "zabbix-server-headless") }}
            - name: ZBX_PROXYMODE
              value: {{ if eq (($instance.mode | default $root.Values.zabbix.proxy.mode)) "passive" }}"1"{{ else }}"0"{{ end }}
            - name: ZBX_ENABLEREMOTECOMMANDS
              value: "0"
            - name: ZBX_CONFIGFREQUENCY
              value: "60"
            - name: ZBX_DATASENDERFREQUENCY
              value: "1"
            - name: ZBX_STARTPOLLERS
              value: "10"
            - name: TZ
              value: {{ $root.Values.zabbix.timezone | quote }}
          volumeMounts:
            - name: proxy-data
              mountPath: /var/lib/zabbix
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $root.Values.zabbix.proxy.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: trapper
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: trapper
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $root.Values.zabbix.proxy.persistence.enabled }}
        - name: proxy-data
          emptyDir: {}
        {{- end }}
  {{- if $root.Values.zabbix.proxy.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: proxy-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $root.Values.global.storageClass }}
        storageClassName: {{ $root.Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $root.Values.zabbix.proxy.persistence.size }}
  {{- end }}
{{- end }}
{{- end }}
