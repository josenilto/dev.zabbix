{{/*
Alternative to Vault/External Secrets for simpler environments: Bitnami Sealed Secrets lets
you commit an asymmetrically-encrypted Secret to Git; only the controller running in-cluster
can decrypt it. This template is disabled by default (externalSecrets.sealedSecrets.enabled)
and ships empty encryptedData as a structural example only - a real SealedSecret is produced
by encrypting a real Secret with `kubeseal` against the target cluster's public cert, e.g.:
  kubectl create secret generic zabbix-db-credentials --dry-run=client -o yaml \
    --from-literal=host=... --from-literal=username=... --from-literal=password=... \
    | kubeseal --format yaml > sealed-zabbix-db-credentials.yaml
Never commit plaintext Secret manifests to this repository.
*/}}
{{- if .Values.externalSecrets.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ if .Values.database.external.enabled }}{{ .Values.database.external.existingSecretName }}{{ else }}{{ .Values.database.internal.mysql.auth.existingSecret }}{{ end }}
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
spec:
  encryptedData: {}
  template:
    metadata:
      name: {{ if .Values.database.external.enabled }}{{ .Values.database.external.existingSecretName }}{{ else }}{{ .Values.database.internal.mysql.auth.existingSecret }}{{ end }}
      namespace: {{ include "zabbix-enterprise.namespace" . }}
    type: Opaque
{{- end }}
