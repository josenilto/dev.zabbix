{{/*
Database credentials are never committed to Git. When externalSecrets.enabled=true this
ExternalSecret pulls them from Vault (or another provider registered on the cluster's
ClusterSecretStore, see gitops/infrastructure/security/) and materializes the Kubernetes
Secret that zabbix-server/zabbix-frontend/the internal DB subchart all reference by name.
For clusters without External Secrets Operator installed yet (e.g. a fresh dev sandbox),
pre-create the same Secret manually - see docs/operations/runbook.md "Bootstrapping database
credentials".
A hostname is not sensitive: for the external/managed-DB path (the common prod case) it
comes straight from values.database.external.host (see _helpers.tpl
"zabbix-enterprise.dbServerHostEnv"), not from Vault - only username/password are fetched
here in that case. The internal MySQL/PostgreSQL quick-start path still sources host from
this Secret, alongside its credentials.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ if .Values.database.external.enabled }}{{ .Values.database.external.existingSecretName }}{{ else }}{{ .Values.database.internal.mysql.auth.existingSecret }}{{ end }}
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.componentLabels" (dict "root" $ "component" "database") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.vault.refreshInterval }}
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ if .Values.database.external.enabled }}{{ .Values.database.external.existingSecretName }}{{ else }}{{ .Values.database.internal.mysql.auth.existingSecret }}{{ end }}
    creationPolicy: Owner
  data:
    {{- if not .Values.database.external.enabled }}
    - secretKey: host
      remoteRef:
        key: {{ .Values.externalSecrets.vault.kvMountPath }}/data/zabbix-enterprise/{{ .Values.global.environment }}/{{ .Values.global.cloud }}/database
        property: host
    {{- end }}
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.vault.kvMountPath }}/data/zabbix-enterprise/{{ .Values.global.environment }}/{{ .Values.global.cloud }}/database
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.vault.kvMountPath }}/data/zabbix-enterprise/{{ .Values.global.environment }}/{{ .Values.global.cloud }}/database
        property: password
{{- end }}
