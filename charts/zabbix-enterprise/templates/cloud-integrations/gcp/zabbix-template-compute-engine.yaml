{{- if and .Values.cloudIntegrations.gcp.enabled (has "compute-engine" .Values.cloudIntegrations.gcp.zabbixTemplates) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zabbix-enterprise.fullname" . }}-zabbix-template-gcp-compute
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
    zabbix-enterprise/template: "true"
data:
  gcp-compute-engine-template.yaml: |
    zabbix_export:
      version: '6.4'
      template_groups:
        - uuid: 4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
          name: 'Cloud/GCP'
      templates:
        - uuid: 5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
          template: 'GCP Compute Engine by HTTP'
          name: 'GCP Compute Engine by HTTP'
          description: 'Worked example: Compute Engine instance health via the stackdriver-exporter bridge (zabbix-enterprise cloud-integrations/gcp).'
          groups:
            - name: 'Cloud/GCP'
          discovery_rules:
            - uuid: 6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e
              name: 'Compute Engine instance discovery'
              type: HTTP_AGENT
              key: 'gcp.compute.instance.discovery'
              delay: 1h
              url: 'http://stackdriver-exporter.monitoring.svc:9255/metrics'
              preprocessing:
                - type: PROMETHEUS_TO_JSON
                  parameters:
                    - 'stackdriver_gce_instance_compute_googleapis_com_instance_cpu_utilization'
              lld_macro_paths:
                - lld_macro: '{#INSTANCEID}'
                  path: '$.instance_id'
              item_prototypes:
                - uuid: 7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
                  name: 'GCE {#INSTANCEID}: CPU utilization'
                  type: HTTP_AGENT
                  key: 'gcp.compute.cpu.utilization[{#INSTANCEID}]'
                  delay: 5m
                  history: 7d
                  trends: 365d
                  value_type: FLOAT
                  units: '%'
                  url: 'http://stackdriver-exporter.monitoring.svc:9255/metrics'
                  preprocessing:
                    - type: PROMETHEUS_PATTERN
                      parameters:
                        - 'stackdriver_gce_instance_compute_googleapis_com_instance_cpu_utilization{instance_id="{#INSTANCEID}"}'
                      error_handler: DISCARD_VALUE
                  tags:
                    - tag: component
                      value: compute
              trigger_prototypes:
                - uuid: 8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a
                  expression: 'min(/GCP Compute Engine by HTTP/gcp.compute.cpu.utilization[{#INSTANCEID}],10m)>0.9'
                  name: 'GCE instance {#INSTANCEID}: high CPU utilization'
                  priority: WARNING
          tags:
            - tag: cloud
              value: gcp
{{- end }}
