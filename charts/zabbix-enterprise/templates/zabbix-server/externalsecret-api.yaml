{{- if .Values.externalSecrets.enabled }}
{{/* Zabbix API user consumed by templates/zabbix-server/template-sync-cronjob.yaml. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zabbix-api-credentials
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.vault.refreshInterval }}
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zabbix-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.vault.kvMountPath }}/data/zabbix-enterprise/{{ .Values.global.environment }}/{{ .Values.global.cloud }}/zabbix-api
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.vault.kvMountPath }}/data/zabbix-enterprise/{{ .Values.global.environment }}/{{ .Values.global.cloud }}/zabbix-api
        property: password
{{- end }}
