{{- if and .Values.zabbix.server.enabled .Values.zabbix.server.persistence.exportDir.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zabbix-enterprise.componentName" (dict "root" $ "component" "zabbix-server-export") }}
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.componentLabels" (dict "root" $ "component" "zabbix-server") | nindent 4 }}
  annotations:
    # NOTE: with replicaCount > 1 this PVC is mounted by every server replica, so the
    # underlying StorageClass MUST support ReadWriteMany (e.g. EFS/Azure Files/Filestore/
    # OCI FSS, or an in-cluster ReadWriteMany provisioner). For single-replica dev use RWO.
    zabbix-enterprise/note: "requires ReadWriteMany when zabbix.server.replicaCount > 1"
spec:
  accessModes:
    {{- if gt (.Values.zabbix.server.replicaCount | int) 1 }}
    - ReadWriteMany
    {{- else }}
    - ReadWriteOnce
    {{- end }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.zabbix.server.persistence.exportDir.size }}
{{- end }}
