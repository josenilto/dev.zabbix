{{- if .Values.global.networkPolicy.enabled }}
{{/*
Everything same-namespace (frontend<->server, server<->proxies, server<->agent,
subchart-to-subchart) is already covered by allow-same-namespace.yaml - the namespace
itself is the trust boundary for this bundled release. What's left here are the two
genuinely cross-namespace/external entry points into that boundary.
*/}}
---
# Frontend ingress from the ingress controller namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zabbix-enterprise.fullname" . }}-allow-frontend
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zabbix-enterprise.selectorLabels" (dict "root" $ "component" "zabbix-frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# Optional: a cluster-wide meta-monitoring Prometheus (living outside this namespace,
# e.g. in "monitoring") scraping this release's metrics endpoints for cross-namespace
# health dashboards. Not required for the platform's own internal metrics pipeline -
# that's intra-namespace and already covered by allow-same-namespace.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zabbix-enterprise.fullname" . }}-allow-external-meta-monitoring
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10051
{{- end }}
