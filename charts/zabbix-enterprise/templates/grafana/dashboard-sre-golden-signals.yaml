{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zabbix-enterprise.fullname" . }}-dashboard-sre-golden-signals
  namespace: {{ include "zabbix-enterprise.namespace" . }}
  labels:
    {{- include "zabbix-enterprise.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  sre-golden-signals.json: |
    {
      "uid": "zbx-sre-golden-signals",
      "title": "SRE - Golden Signals & Error Budget",
      "tags": ["zabbix-enterprise", "sre", "slo"],
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          { "name": "service", "type": "query", "datasource": { "type": "prometheus", "uid": "prometheus" }, "query": "label_values(http_requests_total, service)", "includeAll": true, "current": { "text": "All", "value": "$__all" } }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "gauge",
          "title": "Availability (30d)",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0.99, "max": 1 } },
          "targets": [
            { "expr": "1 - (sum(increase(http_requests_total{status=~\"5..\",service=~\"$service\"}[30d])) / sum(increase(http_requests_total{service=~\"$service\"}[30d])))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Traffic (req/s)",
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_requests_total{service=~\"$service\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Errors (%)",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            { "expr": "sum(rate(http_requests_total{status=~\"5..\",service=~\"$service\"}[5m])) / sum(rate(http_requests_total{service=~\"$service\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latency P95 (s)",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=~\"$service\"}[5m])) by (le))", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Error Budget Burn Rate (1h vs 6h windows)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "slo:errors_ratio:ratio_rate1h{service=~\"$service\"}", "refId": "A", "legendFormat": "1h burn - {{"{{"}}service{{"}}"}}" },
            { "expr": "slo:errors_ratio:ratio_rate6h{service=~\"$service\"}", "refId": "B", "legendFormat": "6h burn - {{"{{"}}service{{"}}"}}" }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Saturation - CPU Throttled Pods",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "topk(10, sum(rate(container_cpu_cfs_throttled_periods_total[5m])) by (pod) / sum(rate(container_cpu_cfs_periods_total[5m])) by (pod))", "refId": "A", "format": "table", "instant": true }
          ]
        }
      ]
    }
{{- end }}
