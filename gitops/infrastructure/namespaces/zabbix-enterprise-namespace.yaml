apiVersion: v1
kind: Namespace
metadata:
  name: zabbix-enterprise
  labels:
    app.kubernetes.io/part-of: zabbix-enterprise
    # Pod Security Admission (built-in, replaces PodSecurityPolicy) - "restricted" for
    # production; dev/hml may run "baseline" via a per-cluster override if needed.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
