## Cluster-scoped, installed once per cluster. Every ExternalSecret in the
## zabbix-enterprise chart (templates/database/externalsecret.yaml,
## templates/zabbix-server/externalsecret-api.yaml,
## templates/cloud-integrations/onprem/externalsecret-vmware.yaml) references this by
## name ("vault-backend"), so it must exist before those reconcile successfully.
## Assumes External Secrets Operator is already installed as a cluster add-on (its own
## Argo CD Application, not part of this chart - see values.externalSecrets.enabled which
## only toggles per-release ExternalSecret objects, not the operator itself).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: zabbix-enterprise
spec:
  provider:
    vault:
      server: "https://vault.example.internal:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: zabbix-enterprise
          serviceAccountRef:
            name: zabbix-enterprise
            namespace: zabbix-enterprise
