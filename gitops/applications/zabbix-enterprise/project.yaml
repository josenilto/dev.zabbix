apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zabbix-enterprise
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: zabbix-enterprise
spec:
  description: >
    Zabbix Enterprise Multi-Cloud Observability Platform - scopes which repos, clusters,
    namespaces and resource kinds the platform's Applications/ApplicationSets are allowed
    to touch (least privilege / multi-tenancy boundary, see docs/security/iam-model.md).
  sourceRepos:
    - "https://github.com/your-org/zabbix-helm.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://open-telemetry.github.io/opentelemetry-helm-charts"
    - "https://charts.bitnami.com/bitnami"
    - "https://charts.external-secrets.io"
    - "https://vmware-tanzu.github.io/helm-charts"
    - "https://opencost.github.io/opencost-helm-chart"
  destinations:
    - namespace: "monitoring"
      server: "*"
    - namespace: "zabbix-enterprise"
      server: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: "kyverno.io"
      kind: "*"
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  orphanedResources:
    warn: true
  roles:
    - name: platform-admin
      description: Full sync/override rights for the platform engineering team.
      policies:
        - p, proj:zabbix-enterprise:platform-admin, applications, *, zabbix-enterprise/*, allow
      groups:
        - "platform-engineering"
    - name: sre-readonly
      description: Read-only visibility for SRE/NOC/SOC (section 2 personas).
      policies:
        - p, proj:zabbix-enterprise:sre-readonly, applications, get, zabbix-enterprise/*, allow
      groups:
        - "sre"
        - "noc"
        - "soc"
